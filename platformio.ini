; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
name = lumvia
; default_envs = developer 

[env]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio

lib_deps =
  ESP8266WiFi
  ESP8266mDNS
  LittleFS

  https://github.com/GyverLibs/FastBot2.git#1.2.8
  https://github.com/GyverLibs/GSON.git#1.8.9
  https://github.com/GyverLibs/GTL.git#1.3.14
  https://github.com/GyverLibs/StringUtils.git#1.6.1
  https://github.com/Makuna/NeoPixelBus.git#2.8.4
  https://github.com/GyverLibs/StringN.git#1.0.7
  https://github.com/GyverLibs/FileData.git#1.0.4
  https://github.com/GyverLibs/GyverHTTP.git#1.0.31
  ; https://github.com/GyverLibs/EncButton.git#3.7.6

build_flags = 
  -std=gnu++17
  
  -I include/common
  -I include/common/types
  -I include/common/types/network
  -I include/common/interfaces

  -I include/common/api
  -I include/common/api/models
  -I include/common/api/parse
  -I include/common/api/serialization
  -I include/common/api/types
  -I include/common/api/base/contracts
  -I include/common/api/base/parse
  -I include/common/api/base/serialization
  -I include/common/api/base/result
  -I include/common/api/base/types

  -I include/network
  -I include/network/config/models

  -I include/logger
  -I include/json
  -I include/storage

  -I include/webserver/
  -I include/webserver/api/models
  -I include/webserver/api/base/models
  -I include/webserver/config/models

  -I include/telegram
  -I include/telegram/api/models
  -I include/telegram/api/base/models
  -I include/telegram/config/models

  -I include/device
  -I include/device/base
  -I include/device/led
  -I include/device/led/config/models

  -I include/app
  -I include/config

build_src_filter =
  +<src/*.cpp>
  +<src/app/**/*.cpp>
  +<src/common/**/*.cpp>
  +<src/config/**/*.cpp>
  +<src/device/**/*.cpp>
  +<src/logger/**/*.cpp>
  +<src/telegram/**/*.cpp>
  +<src/network/**/*.cpp>
  +<src/webserver/**/*.cpp>


[env:developer] 
build_type = release #не используем debug так как это без смысленно pio не поттреживает откудку этой платы и debug падает на библиотке
build_flags = 
  ${env.build_flags}

  -DDEBUG=1

  -DLOGGER_DEBUG_MODE=1                 ; Enable verbose debug output from the logger
  -DENABLE_NETWORK_MODULE=1                ; Enable the Wi-Fi module for network connectivity
  -DENABLE_WEBSERVER_MODULE=1           ; 
  -DENABLE_TELEGRAM_BOT_MODULE=1        ; Enable the Telegram bot module for messaging and notifications
  -DENABLE_DEVICE_MODULE=1              ; Enable core device functionality (e.g. LED controller)
  -DENABLE_CONFIG_MODULE=1              ; Enable storage module for persistent data (0 = disabled, 1 = enabled)

[env:release]
build_type = release
build_flags = 
  ${env.build_flags}

  -DRELEASE=1

  -DLOGGER_DEBUG_MODE=0                 ; Enable verbose debug output from the logger
  -DENABLE_NETWORK_MODULE=1             ; Enable the Wi-Fi module for network connectivity
  -DENABLE_WEBSERVER_MODULE=1           ; Enable Webserver module for start config
  -DENABLE_TELEGRAM_BOT_MODULE=1        ; Enable the Telegram bot module for messaging and notifications
  -DENABLE_DEVICE_MODULE=1              ; Enable core device functionality (e.g. LED controller)
  -DENABLE_CONFIG_MODULE=1              ; Enable storage module for persistent data (0 = disabled, 1 = enabled)

extra_scripts = 
  pre:tools/web-compiler/run.py