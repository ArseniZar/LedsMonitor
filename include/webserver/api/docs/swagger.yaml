openapi: 3.0.0
info:
  title: espWeb
  description: |
    OpenAPI specification for the built-in ESP8266 web server (WebServer).
    Generated from the backend implementation (WebServer.cpp, DeviceModels.*,
    ApiParse/ApiSerialization).
  version: 1.0.0

servers:
  - url: http://192.168.4.1/
    description: ESP8266 access point

paths:
  "/":
    get:
      summary: Get web UI
      description: Returns the HTML page with the configuration UI.
      responses:
        "200":
          description: HTML index page
          content:
            text/html:
              schema:
                type: string

  "/network/scan":
    post:
      summary: Start Wi-Fi scan
      description: Starts scanning for available Wi-Fi networks.
      responses:
        "200":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanNetworkStartedResponseEnvelope"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Get Wi-Fi scan state or results
      description: Returns the current scan state, or the discovered networks once the scan is completed.
      responses:
        "200":
          description: Scan status or results
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScanStatusResponseEnvelope"
                  - $ref: "#/components/schemas/ScanNetworksResponseEnvelope"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/network/connect":
    post:
      summary: Start connection to Wi-Fi network
      description: Accepts the target SSID and password and initiates a connection attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectWifiNetworkRequest"
      responses:
        "200":
          description: Connection attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectWifiNetworkResponseEnvelope"
        "400":
          description: Bad request (empty body, invalid JSON, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Get Wi-Fi connection status
      description: Returns the current Wi-Fi connection state.
      responses:
        "200":
          description: Wi-Fi connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiStatusResponseEnvelope"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/config":
    get:
      summary: Get device configuration
      description: Returns the current device, network, and Telegram configuration.
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConfigResponseEnvelope"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update device configuration
      description: Updates one or more configuration fields. Omitted fields remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigRequest"
      responses:
        "200":
          description: Configuration updated
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/stop":
    get:
      summary: Stop web server
      description: Stops the WebServer and returns HTTP 200 with an empty body.
      responses:
        "200":
          description: Server stopped successfully
    

components:
  schemas:
    ErrorResponse:
      type: object
      description: API error (ApiErrorResponse).
      properties:
        ok:
          type: boolean
          enum: [false]
          example: false
        error_code:
          type: integer
          description: HTTP status code / error code.
          example: 400
        message:
          type: string
          description: Error description.
          example: "Bad request"
      required: [ok, error_code, message]

    WifiNetwork:
      type: object
      description: Wi-Fi network model used by the scan and connect APIs.
      properties:
        ssid:
          type: string
          example: "HomeWiFi"
        password:
          type: string
          example: "12345678"
        rssi:
          type: integer
          description: Signal strength in dBm.
          example: -40
        encryptionType:
          type: integer
          description: Encryption type (enum value from the Wi‑Fi library).
          example: 7
        channel:
          type: integer
          example: 6
        bssid:
          type: string
          example: "00:11:22:33:44:55"
        hidden:
          type: boolean
          example: false
      required: [ssid, password, rssi, encryptionType, channel, bssid, hidden]

    ConnectWifiNetworkRequest:
      type: object
      description: Request body for POST /network/connect.
      properties:
        data:
          type: object
          description: Payload containing WiFi credentials.
          properties:
            ssid:
              type: string
              example: "HomeWiFi"
            password:
              type: string
              example: "12345678"
          required: [ssid, password]
      required: [data]

    UpdateConfigRequest:
      type: object
      description: Request body for PATCH /config.
      properties:
        data:
          type: object
          description: Payload containing the fields to update.
          properties:
            apSsid:
              type: string
              example: "MyAccessPoint"
            apPassword:
              type: string
              example: "ap-password"
            mdnsName:
              type: string
              example: "lumvia"
            wifiConnectionTimeoutMs:
              type: integer
              format: int64
              example: 60000
            countLed:
              type: integer
              format: int32
              example: 8
            deviceName:
              type: string
              example: "Lumvia"
            token:
              type: string
              example: "1234567890:ABCDEF"
            limitMessage:
              type: integer
              format: int32
              example: 20
            periodUpdate:
              type: integer
              format: int32
              example: 60
      required: [data]

    ScanNetworkStartedResult:
      type: object
      description: result field for POST /network/scan.
      properties:
        scan:
          type: object
          properties:
            started:
              type: boolean
              description: Indicates whether the scan was started successfully.
              example: true
          required: [started]
      required: [scan]

    ScanStatusResult:
      type: object
      description: result field for GET /network/scan while the scan is running.
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              description: |
                Scan status code (enum ScanState):
                  * -2 = FAILED
                  * -1 = RUNNING
                  * 0 = COMPLETED
              enum: [-2, -1, 0]
              example: 0
          required: [code]
      required: [status]

    ScanNetworksResult:
      type: object
      description: result field for GET /network/scan when the scan is complete.
      properties:
        networks:
          type: array
          items:
            $ref: "#/components/schemas/WifiNetwork"
      required: [networks]

    ConnectWifiNetworkStartedResult:
      type: object
      description: result field for POST /network/connect.
      properties:
        connect:
          type: object
          properties:
            started:
              type: boolean
              description: Indicates whether the connection attempt was initiated.
              example: true
          required: [started]
      required: [connect]

    WifiStatusResult:
      type: object
      description: result field for GET /network/connect.
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              description: |
                Connection state code (enum ConnState):
                  * 255 = WL_NO_SHIELD
                  * 0 = WL_IDLE_STATUS
                  * 1 = WL_NO_SSID_AVAIL
                  * 2 = WL_SCAN_COMPLETED
                  * 3 = WL_CONNECTED
                  * 4 = WL_CONNECT_FAILED
                  * 5 = WL_CONNECTION_LOST
                  * 6 = WL_WRONG_PASSWORD
                  * 7 = WL_DISCONNECTED
              enum: [255, 0, 1, 2, 3, 4, 5, 6, 7]
              example: 3
          required: [code]
      required: [status]

    GetConfigResult:
      type: object
      description: result field for GET /config.
      properties:
        config:
          type: object
          properties:
            apSsid:
              type: string
              example: "MyAccessPoint"
            apPassword:
              type: string
              example: "ap-password"
            mdnsName:
              type: string
              example: "lumvia"
            wifiConnectionTimeoutMs:
              type: integer
              format: int64
              example: 60000
            countLed:
              type: integer
              format: int32
              example: 8
            deviceName:
              type: string
              example: "Lumvia"
            token:
              type: string
              example: "1234567890:ABCDEF"
            limitMessage:
              type: integer
              format: int32
              example: 20
            periodUpdate:
              type: integer
              format: int32
              example: 60
          required: [apSsid, apPassword, mdnsName, wifiConnectionTimeoutMs, countLed, deviceName, token, limitMessage, periodUpdate]
      required: [config]

    ConnectWifiNetworkResponseEnvelope:
      type: object
      description: Successful response ApiSuccessResponse<ConnectWifiNetworkStartedResponse>.
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        result:
          $ref: "#/components/schemas/ConnectWifiNetworkStartedResult"
      required: [ok, result]

    GetConfigResponseEnvelope:
      type: object
      description: Successful response ApiSuccessResponse<GetConfigResponse>.
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        result:
          $ref: "#/components/schemas/GetConfigResult"
      required: [ok, result]

    ScanNetworkStartedResponseEnvelope:
      type: object
      description: Successful response ApiSuccessResponse<ScanWifiNetworkStartedResponse>.
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        result:
          $ref: "#/components/schemas/ScanNetworkStartedResult"
      required: [ok, result]

    ScanStatusResponseEnvelope:
      type: object
      description: Successful response ApiSuccessResponse<GetScanStatusResponse>.
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        result:
          $ref: "#/components/schemas/ScanStatusResult"
      required: [ok, result]

    ScanNetworksResponseEnvelope:
      type: object
      description: Successful response ApiSuccessResponse<ScanWifiNetworkResponse>.
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        result:
          $ref: "#/components/schemas/ScanNetworksResult"
      required: [ok, result]

    WifiStatusResponseEnvelope:
      type: object
      description: Successful response ApiSuccessResponse<GetWifiStatusResponse>.
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        result:
          $ref: "#/components/schemas/WifiStatusResult"
      required: [ok, result]
